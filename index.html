<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>21TechSpace — Dominate Digitally</title>
    <meta name="description" content="We build high-performance websites, applications and software solutions that help your business grow." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Static forms so Netlify's build bot can detect them (it only scans
         the built HTML, not the React-rendered ones). Kept hidden — the
         real forms in ContactPanel.jsx submit to these by name. Do not
         remove the field names below without also updating ContactPanel.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="details"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="subscribe" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
